<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POLaRiS</title>
<link rel="stylesheet" href="assets/maimai-decoration-bg.css">
<style>
  :root {
    --page-w: 1920px;
    --page-h: 1080px;
    --ink: #2f4867;
    --blue: #2e6094;
    --muted: #5e7e9e;
    --pink: #e85b9f;
    --cyan: #38c6eb;
    --page-scale: 1;
    
    /* 动画时间参数 */
    --t0:         0.17s;
    --dur-chip:   0.62s;
    --dur-base:   0.80s;
    --dur-purple: 0.70s;
    --dur-white:  0.68s;
    --dur-bg:     0.75s;
    --t-exit-chip:   1.62s;
    --t-exit-base:   1.746s;
    --t-exit-bg:     1.746s;
    --dur-exit-chip: 0.42s;
    --dur-exit-base: 0.294s;
    --dur-exit-bg:   0.294s;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #45c7e3;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
  }

  /* 【核心修复】统一的 16:9 虚拟画布超级容器
    让所有元素（背景、内容、动画）全部基于这个 1920x1080 的框定位
  */
  .canvas-container {
    position: absolute;
    width: var(--page-w);
    height: var(--page-h);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--page-scale));
    transform-origin: center center;
    overflow: hidden;
    pointer-events: auto; /* 允许内部元素交互 */
  }

  /* 彩虹装饰背景：铺满画布 */
  .maiDecorationBg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* 中间的白卡片 
    现在使用绝对定位，死死固定在 1920x1080 画布的正中央
  */
  .container {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 35px 50px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.15);
    z-index: 2;
    width: 550px; /* 放大卡片以适应 1920 画布 */
  }
  .container h1 {
    font-size: 54px;
    margin: 0 0 10px 0;
    color: var(--blue);
  }
  .subtitle {
    color: #666;
    font-style: italic; 
    font-size: 24px;
    margin-top: 0;
    margin-bottom: 30px;
  }
  img {
    max-width: 100%;
    height: auto;
    border-radius: 12px;
  }

  /* 转场动画舞台：铺满画布，层级最高 */
  .stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }
  .stage > .frame {
    width: 100%;
    height: 100%;
    background: transparent;
  }
  .stage svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ===== 以下为原始 SVG 动画关键帧，保持不变 ===== */
  @keyframes chip-in {
    0%   { transform: rotate(-180deg) scale(4.50); opacity: 0;    }
    5%   { transform: rotate(-170deg) scale(4.30); opacity: 0.55; }
    18%  { transform: rotate(-140deg) scale(3.60); opacity: 0.85; }
    32%  { transform: rotate(-100deg) scale(2.50); opacity: 0.95; }
    48%  { transform: rotate(-55deg)  scale(1.40); opacity: 1;    }
    62%  { transform: rotate(-22deg)  scale(0.96); opacity: 1;    }
    74%  { transform: rotate(-8deg)   scale(0.91); opacity: 1;    }
    86%  { transform: rotate(-2deg)   scale(0.97); opacity: 1;    }
    94%  { transform: rotate(0deg)    scale(1.015);opacity: 1;    }
    100% { transform: rotate(0deg)    scale(1.00); opacity: 1;    }
  }
  @keyframes settle-TL {
    0%   { transform: translate(-2400px, -1500px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes settle-BR {
    0%   { transform: translate(2400px, 1500px); }
    100% { transform: translate(0, 0); }
  }
  @keyframes converge-TL {
    0%   { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(-2400px, -1500px); animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    65%  { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(100px, 60px);     animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    85%  { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(-25px, -15px);    animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    100% { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(0, 0); }
  }
  @keyframes converge-BR {
    0%   { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(2400px, 1500px);  animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    65%  { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(-100px, -60px);   animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    85%  { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(25px, 15px);      animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    100% { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px) translate(0, 0); }
  }
  @keyframes slide-TR-to-BL {
    0%   { transform: translate(2400px, -2400px); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translate(0, 0); opacity: 1; }
  }
  @keyframes slide-BL-to-TR {
    0%   { transform: translate(-2400px, 2400px); opacity: 0; }
    18%  { opacity: 1; }
    100% { transform: translate(0, 0); opacity: 1; }
  }
  @keyframes chip-out {
    0%   { transform: scale(1.00); opacity: 1;    }
    30%  { transform: scale(0.82); opacity: 1;    }
    50%  { transform: scale(2.20); opacity: 0.65; }
    70%  { transform: scale(3.40); opacity: 0.30; }
    85%  { transform: scale(4.20); opacity: 0.05; }
    100% { transform: scale(4.60); opacity: 0;    }
  }
  @keyframes bg-out {
    0%   { transform: scale(1.00); opacity: 1;    }
    30%  { transform: scale(0.94); opacity: 1;    }
    55%  { transform: scale(1.90); opacity: 1;    }
    75%  { transform: scale(2.90); opacity: 0.55; }
    90%  { transform: scale(3.70); opacity: 0.15; }
    100% { transform: scale(4.20); opacity: 0;    }
  }
  @keyframes expand-TL  {
    0%   { transform: translate(0, 0);              opacity: 1;    }
    70%  { transform: translate(-1680px,-1050px);    opacity: 0.55; }
    100% { transform: translate(-2400px,-1500px);    opacity: 0;    }
  }
  @keyframes expand-BR  {
    0%   { transform: translate(0, 0);              opacity: 1;    }
    70%  { transform: translate( 1680px, 1050px);    opacity: 0.55; }
    100% { transform: translate( 2400px, 1500px);    opacity: 0;    }
  }
  @keyframes converge-TL-out {
    0%,100% { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px); }
  }
  @keyframes converge-BR-out {
    0%,100% { transform: translate(1920px,1080px) scale(1.06) translate(-1920px,-1080px); }
  }
  @keyframes slide-TR-to-BL-out {
    from { transform: translate(0, 0);                opacity: 1; }
    to   { transform: translate(-2200px, 2200px);     opacity: 0; }
  }
  @keyframes slide-BL-to-TR-out {
    from { transform: translate(0, 0);                opacity: 1; }
    to   { transform: translate( 2200px,-2200px);     opacity: 0; }
  }
  #两角淡紫, #两角白色 {
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation-name: bg-out;
    animation-duration: var(--dur-exit-chip);
    animation-timing-function: linear;
    animation-delay: var(--t-exit-chip);
    animation-fill-mode: forwards;
  }
  #滴拉熊 {
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation-name:            chip-in,                                chip-out;
    animation-duration:        var(--dur-chip),                         var(--dur-exit-chip);
    animation-timing-function: linear,                                  linear;
    animation-delay:           calc(var(--t0) - 0.02s),                 var(--t-exit-chip);
    animation-fill-mode:       both,                                    forwards;
  }
  #左上小方块, #左上底板 {
    animation-name:            settle-TL,                               expand-TL;
    animation-duration:        var(--dur-base),                         var(--dur-exit-base);
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1),          linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #右下小方块, #右下底板 {
    animation-name:            settle-BR,                               expand-BR;
    animation-duration:        var(--dur-base),                         var(--dur-exit-base);
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1),          linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #两角淡紫 > [id="左上"] {
    animation-name:            converge-TL,                             converge-TL-out;
    animation-duration:        var(--dur-purple),                       var(--dur-exit-base);
    animation-timing-function: linear,                                  linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #两角淡紫 > [id="右下"] {
    animation-name:            converge-BR,                             converge-BR-out;
    animation-duration:        var(--dur-purple),                       var(--dur-exit-base);
    animation-timing-function: linear,                                  linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #两角白色 > [id="左上"] {
    animation-name:            converge-TL,                             converge-TL-out;
    animation-duration:        var(--dur-white),                        var(--dur-exit-base);
    animation-timing-function: linear,                                  linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #两角白色 > [id="右下"] {
    animation-name:            converge-BR,                             converge-BR-out;
    animation-duration:        var(--dur-white),                        var(--dur-exit-base);
    animation-timing-function: linear,                                  linear;
    animation-delay:           var(--t0),                               var(--t-exit-base);
    animation-fill-mode:       both,                                    forwards;
  }
  #HOLD > use {
    transform-box: fill-box;
    animation-name: slide-TR-to-BL, slide-TR-to-BL-out;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1), cubic-bezier(0.55, 0, 1, 0.45);
    animation-fill-mode: both, forwards;
    animation-duration: var(--dur-bg), var(--dur-exit-bg);
    animation-delay: var(--t0), var(--t-exit-bg);
  }
  #Slide > use {
    transform-box: fill-box;
    animation-name: slide-BL-to-TR, slide-BL-to-TR-out;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1), cubic-bezier(0.55, 0, 1, 0.45);
    animation-fill-mode: both, forwards;
    animation-duration: var(--dur-bg), var(--dur-exit-bg);
    animation-delay: var(--t0), var(--t-exit-bg);
  }
</style>
</head>
<body>

  <div class="canvas-container">
    
    <div class="maiDecorationBg" aria-hidden="true">
      <div class="shines-layer">
        <div class="shines">
          <div class="shine diamond-pink"></div>
          <div class="shine diamond-yellow"></div>
          <div class="shine diamond-white"></div>
          <div class="shine star-white"></div>
          <div class="shine star-yellow-left"></div>
          <div class="shine star-yellow-right"></div>
        </div>
      </div>
      <div class="background-layer">
        <div class="pattern-layer"></div>
        <div class="decoration-container">
          <div class="auroras"><div class="aurora aurora-front"></div><div class="aurora aurora-back"></div></div>
          <div class="clouds">
            <div class="cloud front-left"></div><div class="cloud front-right"></div><div class="cloud front-center"></div>
            <div class="cloud back-left"></div><div class="cloud back-right"></div><div class="cloud back-center"></div>
          </div>
          <div class="moon"></div>
        </div>
        <div class="shooting-stars">
          <div class="shooting-star shooting-star1"><div class="shooting-star-inner"><div class="shooting-star-tail green"></div><div class="shooting-star-head green"></div></div></div>
          <div class="shooting-star shooting-star2"><div class="shooting-star-inner"><div class="shooting-star-tail"></div><div class="shooting-star-head"></div></div></div>
          <div class="shooting-star shooting-star3"><div class="shooting-star-inner"><div class="shooting-star-tail pink"></div><div class="shooting-star-head pink"></div></div></div>
          <div class="shooting-star shooting-star4"><div class="shooting-star-inner"><div class="shooting-star-tail green"></div><div class="shooting-star-head green"></div></div></div>
          <div class="shooting-star shooting-star5"><div class="shooting-star-inner"><div class="shooting-star-tail pink"></div><div class="shooting-star-head pink"></div></div></div>
          <div class="shooting-star shooting-star6"><div class="shooting-star-inner"><div class="shooting-star-tail"></div><div class="shooting-star-head"></div></div></div>
          <div class="shooting-star shooting-star7"><div class="shooting-star-inner"><div class="shooting-star-tail"></div><div class="shooting-star-head"></div></div></div>
        </div>
        <div class="rainbow"></div>
        <div class="rainbow-bottom"></div>
      </div>
    </div>

    <div class="container">
      <h1>POLaRiS</h1>
      <p class="subtitle">Maximum Apparent Magnitude</p> 
      <img src="gunmu.png" alt="看到这个请刷新网页直到图片显示">
    </div>

    <div class="stage">
      <div class="frame" id="frame"></div>
    </div>

  </div>

<script>
  const frame = document.getElementById('frame');

  /* 【核心修复】统一缩放公式
    完美计算当前屏幕（无论是手机狭长屏还是电脑屏）放入 1920x1080 所需的缩放比 
  */
  const fitPage = () => {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.setProperty("--page-scale", scale.toString());
  };
  fitPage();
  window.addEventListener("resize", fitPage);
  window.addEventListener("orientationchange", fitPage);

  function jitterSlides(root) {
    const all = root.querySelectorAll('#HOLD > use, #Slide > use');
    all.forEach(el => {
      const durIn    = 0.55 + Math.random() * 0.25;
      const delayIn  = 0.17 + Math.random() * 0.06;
      const durOut   = 0.15 + Math.random() * 0.03;
      const delayOut = 1.583 + Math.random() * 0.04;
      el.style.animationDuration = `${durIn.toFixed(3)}s, ${durOut.toFixed(3)}s`;
      el.style.animationDelay    = `${delayIn.toFixed(3)}s, ${delayOut.toFixed(3)}s`;
    });
  }

  function elevateChip(root) {
    const svg = root.querySelector('svg');
    if (!svg) return;
    const chip = svg.querySelector('#滴拉熊');
    if (chip) svg.appendChild(chip);
  }

  async function loadSVG() {
    try {
      const res = await fetch('舞萌转场复刻_16比9.svg');
      const text = await res.text();
      frame.innerHTML = text;
      elevateChip(frame);
      jitterSlides(frame);
    } catch (e) {}
  }

  loadSVG();
</script>
</body>
</html>
